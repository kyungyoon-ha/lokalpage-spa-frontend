<script>
  $(function () {
    const opentargets = [
      ".sc-open .logo-img",
      ".sc-open .cont-wrap .open-text",
      ".sc-open .cont-wrap .sub-text",
      ".sc-open .cont-wrap .date-text",
      ".sc-open .btn-wrap a",
    ];

    opentargets.forEach((sel) => {
      ScrollTrigger.create({
        trigger: ".sc-open",
        start: "-10% 40%",
        end: "200% 100%",
        //markers:true,
        toggleClass: { targets: sel, className: "on" },
      });
    });
  });
</script>
