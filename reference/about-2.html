<script>
  $(function () {
    gsap.set(".sc-brand .group-brand.first img.left", {
      y: 60,
      opacity: 0,
      filter: "blur(5px)",
    });
    gsap.set(".sc-brand .group-brand.first img.right", {
      y: -60,
      opacity: 0,
      filter: "blur(5px)",
    });
    gsap.set(".sc-brand .group-brand.first .cont-area", {
      opacity: 0,
      filter: "blur(5px)",
    });

    gsap.set(".sc-brand .group-brand.second img.left", {
      y: 60,
      opacity: 0,
      filter: "blur(5px)",
    });
    gsap.set(".sc-brand .group-brand.second img.right", {
      y: -60,
      opacity: 0,
      filter: "blur(5px)",
    });
    gsap.set(".sc-brand .group-brand.second .cont-area", {
      opacity: 0,
      filter: "blur(5px)",
    });

    let brandmotion = gsap.timeline({
      scrollTrigger: {
        trigger: ".sc-brand",
        start: "-80px 0%",
        end: "300% 100%",
        pin: true,
        scrub: true,
      },
    });

    brandmotion
      .addLabel("a")
      .to(
        ".sc-brand .group-brand.first img.left",
        1.2,
        { y: 0, opacity: 1, filter: "blur(0px)" },
        "a",
      )
      .to(
        ".sc-brand .group-brand.first img.right",
        1.2,
        { y: 0, opacity: 1, filter: "blur(0px)" },
        "a",
      )
      .to(
        ".sc-brand .group-brand.first .cont-area",
        1.2,
        { opacity: 1, filter: "blur(0px)" },
        "a",
      )

      .addLabel("b")
      .to(
        ".sc-brand .group-brand.first img.left",
        1,
        { y: -60, opacity: 0, filter: "blur(5px)" },
        "b",
      )
      .to(
        ".sc-brand .group-brand.first img.right",
        1,
        { y: 60, opacity: 0, filter: "blur(5px)" },
        "b",
      )
      .to(
        ".sc-brand .group-brand.first .cont-area",
        1,
        { opacity: 0, filter: "blur(5px)" },
        "b",
      )

      .to(
        ".sc-brand .group-brand.second img.left",
        1.2,
        { y: 0, opacity: 1, filter: "blur(0px)" },
        "b",
      )
      .to(
        ".sc-brand .group-brand.second img.right",
        1.2,
        { y: 0, opacity: 1, filter: "blur(0px)" },
        "b",
      )
      .to(
        ".sc-brand .group-brand.second .cont-area",
        1.2,
        { opacity: 1, filter: "blur(0px)" },
        "b",
      );
  });
</script>
